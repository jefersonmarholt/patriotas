const STORAGE_KEY = "patriotas-dados-v1";
const UNLOCK_KEY = "patriotas-unlocked-v1";

/* ---------- persistence (localStorage, com fallback em memoria) ---------- */
let memoryFallback = null;
function loadStored() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return memoryFallback;
  }
}
function saveStored(recs) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recs));
  } catch (e) {
    memoryFallback = recs;
  }
}
function loadUnlocked() {
  try { return localStorage.getItem(UNLOCK_KEY) === "1"; } catch (e) { return false; }
}
function saveUnlocked(v) {
  try { v ? localStorage.setItem(UNLOCK_KEY, "1") : localStorage.removeItem(UNLOCK_KEY); } catch (e) {}
}

/* ---------- utils ---------- */
function normName(s) { return (s || "").toString().replace(/\s+/g, " ").trim(); }

function distGenero(categoria) {
  if (!categoria) return { grupo: "—", genero: "—", km: null };
  const c = categoria.trim();
  const letter = c[0];
  if (letter >= "A" && letter <= "J") return { grupo: "5KM · FEMININO", genero: "F", km: 5 };
  if (letter >= "K" && letter <= "U") return { grupo: "5KM · MASCULINO", genero: "M", km: 5 };
  if (letter >= "a" && letter <= "e") return { grupo: "2KM · MASCULINO", genero: "M", km: 2 };
  if (letter >= "f" && letter <= "j") return { grupo: "2KM · FEMININO", genero: "F", km: 2 };
  return { grupo: "OUTRA", genero: "—", km: null };
}
function faixaEtaria(categoria) {
  if (!categoria) return "";
  const m = categoria.match(/(\d{4}.*)$/);
  return m ? m[1].replace(/^[-–\s]+/, "") : categoria;
}
function fmtPace(pace) {
  if (!pace) return "—";
  const parts = String(pace).split(":");
  if (parts.length < 2) return pace;
  return `${parseInt(parts[0], 10)}:${parts[1]} /km`;
}
function fmtDateBR(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

/* ---------- parsing robusto de datas/horas do Excel ----------
   Usa cellDates para obter objetos Date nativos, evitando que o
   formato de data mude conforme a configuracao regional do Excel
   de quem importa (ex.: "2/22/26" em vez de "22/02/2026"). */
function excelDateToISO(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date && !isNaN(v)) {
    const y = v.getUTCFullYear(), m = String(v.getUTCMonth() + 1).padStart(2, "0"), d = String(v.getUTCDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  if (typeof v === "number") {
    const d = XLSX.SSF.parse_date_code(v);
    if (d) return `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}`;
  }
  const s = String(v).trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) {
    let day = parseInt(m[1], 10), month = parseInt(m[2], 10);
    let year = parseInt(m[3], 10);
    if (year < 100) year += 2000;
    if (month > 12 && day <= 12) { const t = day; day = month; month = t; }
    return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  }
  return null;
}
function excelTimeToStr(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date && !isNaN(v)) {
    const h = String(v.getUTCHours()).padStart(2, "0"), m = String(v.getUTCMinutes()).padStart(2, "0"), s = String(v.getUTCSeconds()).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }
  if (typeof v === "number") {
    const totalSec = Math.round(v * 86400);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
    const s = String(totalSec % 60).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }
  return String(v);
}

function parseWorkbookToRecords(workbook) {
  const sheetName = workbook.SheetNames.includes("DADOS") ? "DADOS" : workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });
  const records = [];
  let startIdx = 0;
  for (let i = 0; i < rows.length; i++) {
    if (rows[i] && rows[i].some((c) => (c || "").toString().toUpperCase().includes("NOME"))) {
      startIdx = i + 1; break;
    }
  }
  for (let i = startIdx; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r[2]) continue;
    records.push({
      data: excelDateToISO(r[0]), numero: r[1] || null, nome: normName(r[2]), categoria: normName(r[3]),
      local: r[4] || null, distancia: r[5] || null, tempo: excelTimeToStr(r[6]), pace: excelTimeToStr(r[7]),
      obs: r[8] || null, classCategoria: r[9] || null, classGeral: r[10] || null, pontos: Number(r[11]) || 0,
    });
  }
  return records;
}

          <div style={{ flex: 1, background: C.surface2, borderRadius: 4, overflow: "hidden" }}>
            <div style={{
              width: `${(d.pontos / max) * 100}%`, minWidth: d.pontos ? 6 : 0, height: Math.max(14, rowH - 8),
              background: i < 3 ? C.orange : "#38404C", borderRadius: 4,
              display: "flex", alignItems: "center", justifyContent: "flex-end", paddingRight: 8,
            }}>
              <span className="mono" style={{ fontSize: 11, fontWeight: 700, color: i < 3 ? "#2A1400" : C.text }}>{d.pontos}</span>
            </div>
          </div>
        </div>
      ))}
      {data.length === 0 && <div style={{ color: C.textFaint, fontSize: 12 }}>Sem dados.</div>}
    </div>
  );
}

function LineChartSVG({ data, height = 180 }) {
  const [hover, setHover] = useState(null);
  const w = 600, h = height, padL = 30, padB = 22, padT = 14, padR = 12;
  const max = Math.max(1, ...data.map((d) => d.pontos));
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
  const pts = data.map((d, i) => ({
    x: padL + stepX * i,
    y: padT + innerH - (d.pontos / max) * innerH,
    ...d,
  }));
  const path = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x},${p.y}`).join(" ");
  return (
    <div style={{ position: "relative" }}>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height }} preserveAspectRatio="none">
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={padL} x2={w - padR} y1={padT + innerH * f} y2={padT + innerH * f} stroke={C.border} strokeWidth="1" />
        ))}
        <path d={path} fill="none" stroke={C.orange} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
        {pts.map((p, i) => (
          <circle key={i} cx={p.x} cy={p.y} r={hover === i ? 6 : 4} fill={C.orange}
            onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
            style={{ cursor: "pointer" }} />
        ))}
        {pts.map((p, i) => (
          <text key={i} x={p.x} y={h - 4} fontSize="10" fill={C.textFaint} textAnchor="middle">{p.etapa}</text>
        ))}
      </svg>
      {hover !== null && pts[hover] && (
        <div style={{
          position: "absolute", left: `${(pts[hover].x / w) * 100}%`, top: 0, transform: "translateX(-50%)",
          background: C.ink, color: C.text, fontSize: 11, padding: "4px 8px", borderRadius: 6, whiteSpace: "nowrap", pointerEvents: "none",
          border: `1px solid ${C.border}`,
        }}>
          {pts[hover].local}: <b>{pts[hover].pontos} pts</b>
        </div>
      )}
    </div>
  );
}

/* ---------- modal de importacao protegida por chave de acesso ---------- */
function ImportModal({ onClose, records, onImported }) {
  const [unlocked, setUnlocked] = useState(loadUnlocked());
  const [keyInput, setKeyInput] = useState("");
  const [keyError, setKeyError] = useState(false);
  const [importState, setImportState] = useState({ status: "idle", msg: "" });
  const fileInputRef = useRef(null);

  const tryUnlock = () => {
    if (keyInput === ACCESS_KEY) {
      setUnlocked(true);
      saveUnlocked(true);
      setKeyError(false);
    } else {
      setKeyError(true);
    }
  };

  const relock = () => {
    setUnlocked(false);
    saveUnlocked(false);
    setKeyInput("");
  };

  const handleFile = async (file) => {
    if (!file) return;
    setImportState({ status: "loading", msg: "Lendo planilha..." });
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true, raw: true });
      const recs = parseWorkbookToRecords(wb);
      if (!recs.length) throw new Error("Nenhum resultado encontrado na aba DADOS.");
      onImported(recs);
      setImportState({ status: "success", msg: `${recs.length} resultados importados com sucesso.` });
    } catch (e) {
      setImportState({ status: "error", msg: e.message || "Falha ao importar o arquivo." });
    }
  };

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            {unlocked ? <IconUnlock size={16} color={C.success} /> : <IconLock size={16} color={C.orange} />}
            <span className="disp" style={{ fontSize: 18 }}>{unlocked ? "IMPORTAR PLANILHA" : "ÁREA RESTRITA"}</span>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: C.textDim, cursor: "pointer", padding: 4 }}>
            <IconX size={16} />
          </button>
        </div>

        {!unlocked && (
          <React.Fragment>
            <p style={{ fontSize: 12.5, color: C.textDim, margin: "0 0 14px" }}>
              Esta área é só para quem cuida dos dados do grupo. Informe a chave de acesso para importar uma nova planilha.
            </p>
            <input
              type="password"
              value={keyInput}
              onChange={(e) => { setKeyInput(e.target.value); setKeyError(false); }}
              onKeyDown={(e) => e.key === "Enter" && tryUnlock()}
              placeholder="Chave de acesso"
              autoFocus
              style={{
                width: "100%", background: C.surface2, border: `1px solid ${keyError ? C.brick : C.border}`,
                borderRadius: 8, padding: "10px 12px", color: C.text, fontSize: 14, marginBottom: 8,
              }}
            />
            {keyError && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, color: C.brick, fontSize: 12, marginBottom: 10 }}>
                <IconAlert size={13} /> Chave incorreta.
              </div>
            )}
            <button
              onClick={tryUnlock}
              style={{
                width: "100%", background: C.orange, color: "#1A1200", border: "none", borderRadius: 8,
                padding: "10px 14px", fontWeight: 700, fontSize: 13, cursor: "pointer", marginTop: keyError ? 0 : 6,
              }}
            >
              Entrar
            </button>
          </React.Fragment>
        )}

        {unlocked && (
          <React.Fragment>
            <p style={{ fontSize: 12.5, color: C.textDim, margin: "0 0 14px" }}>
              Envie a planilha .xlsx (aba <b style={{ color: C.text }}>DADOS</b>) sempre que uma nova etapa for lançada.
            </p>
            <input
              ref={fileInputRef}
              type="file"
              accept=".xlsx,.xlsm"
              style={{ display: "none" }}
              onChange={(e) => handleFile(e.target.files && e.target.files[0])}
            />
            <button
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              style={{
                display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%",
                background: C.orange, color: "#1A1200", border: "none", borderRadius: 8, padding: "10px 14px",
                fontWeight: 700, fontSize: 13, cursor: "pointer",
              }}
            >
              <IconUpload size={15} /> Importar planilha (.xlsx)
            </button>
            {importState.status !== "idle" && (
              <div style={{
                marginTop: 12, fontSize: 12, display: "flex", alignItems: "center", gap: 6,
                color: importState.status === "error" ? C.brick : importState.status === "success" ? C.success : C.textDim,
              }}>
                {importState.status === "success" && <IconCheck size={13} />}
                {importState.status === "error" && <IconAlert size={13} />}
                {importState.msg}
              </div>
            )}
            <button
              onClick={relock}
              style={{
                width: "100%", background: "none", color: C.textFaint, border: "none",
                padding: "10px 0 0", fontSize: 11.5, cursor: "pointer", textDecoration: "underline",
              }}
            >
              Bloquear novamente
            </button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}


function PatriotasDashboard() {
  const [records, setRecords] = useState(() => loadStored() || RAW_SEED);
  const [distFilter, setDistFilter] = useState("TODAS");
  const [selectedEtapaIdx, setSelectedEtapaIdx] = useState(-1);
  const [selectedAtleta, setSelectedAtleta] = useState(null);
  const [showImportModal, setShowImportModal] = useState(false);

  const handleImported = useCallback((recs) => {
    setRecords(recs);
    saveStored(recs);
    setSelectedAtleta(null);
  }, []);

  const etapas = useMemo(() => {
    const map = new Map();
    records.forEach((r) => {
      if (!r.data) return;
      const key = `${r.data}__${r.local}`;
      if (!map.has(key)) map.set(key, { data: r.data, local: r.local });
    });
    return Array.from(map.values()).sort((a, b) => (a.data > b.data ? 1 : -1));
  }, [records]);

  const scoped = useMemo(() => {
    let recs = records;
    if (distFilter !== "TODAS") recs = recs.filter((r) => distGenero(r.categoria).grupo === distFilter);
    if (selectedEtapaIdx >= 0 && etapas[selectedEtapaIdx]) {
      const et = etapas[selectedEtapaIdx];
      recs = recs.filter((r) => r.data === et.data && r.local === et.local);
    }
    return recs;
  }, [records, distFilter, selectedEtapaIdx, etapas]);

  const ranking = useMemo(() => {
    const agg = new Map();
    scoped.forEach((r) => {
      if (!r.nome) return;
      if (!agg.has(r.nome)) agg.set(r.nome, { nome: r.nome, categoria: r.categoria, pontos: 0, etapas: 0, melhorClass: null, resultados: [] });
      const a = agg.get(r.nome);
      a.pontos += r.pontos || 0; a.etapas += 1; a.categoria = r.categoria || a.categoria;
      if (r.classCategoria != null) {
        const cNum = parseInt(String(r.classCategoria).replace(/\D/g, ""), 10);
        if (!isNaN(cNum) && (a.melhorClass == null || cNum < a.melhorClass)) a.melhorClass = cNum;
      }
      a.resultados.push(r);
    });
    return Array.from(agg.values()).sort((a, b) => b.pontos - a.pontos);
  }, [scoped]);

  const kpis = useMemo(() => {
    const atletas = new Set(records.map((r) => r.nome)).size;

              <div style={{ display: "flex", gap: 18 }}>
                <div style={{ textAlign: "center" }}><div className="mono" style={{ fontSize: 26, fontWeight: 700 }}>{athleteDetail.pontos}</div><div style={{ fontSize: 10, color: C.textFaint }}>PONTOS</div></div>
                <div style={{ textAlign: "center" }}><div className="mono" style={{ fontSize: 26, fontWeight: 700 }}>{athleteDetail.etapas}</div><div style={{ fontSize: 10, color: C.textFaint }}>ETAPAS</div></div>
                <div style={{ textAlign: "center" }}><div className="mono" style={{ fontSize: 26, fontWeight: 700 }}>{athleteDetail.melhorClass ?? "—"}</div><div style={{ fontSize: 10, color: C.textFaint }}>MELHOR POSIÇÃO</div></div>
              </div>
            </div>

            <LineChartSVG data={pontosPorEtapaChart} height={180} />

            <div style={{ overflowX: "auto", marginTop: 16 }}>
              <table style={{ width: "100%", fontSize: 12.5, minWidth: 640 }}>
                <thead>
                  <tr style={{ textAlign: "left", color: C.textFaint, fontSize: 11 }}>
                    <th style={{ padding: "6px 8px" }}>ETAPA</th><th style={{ padding: "6px 8px" }}>DATA</th>
                    <th style={{ padding: "6px 8px" }}>TEMPO</th><th style={{ padding: "6px 8px" }}>PACE</th>
                    <th style={{ padding: "6px 8px" }}>POS. CATEGORIA</th><th style={{ padding: "6px 8px" }}>POS. GERAL</th>
                    <th style={{ padding: "6px 8px", textAlign: "right" }}>PONTOS</th>
                  </tr>
                </thead>
                <tbody>
                  {athleteDetail.resultados.slice().sort((a, b) => (a.data > b.data ? 1 : -1)).map((r, i) => (
                    <tr key={i} style={{ borderTop: `1px solid ${C.border}` }}>
                      <td style={{ padding: "7px 8px", fontWeight: 600 }}>{r.local}</td>
                      <td className="mono" style={{ padding: "7px 8px" }}>{fmtDateBR(r.data)}</td>
                      <td className="mono" style={{ padding: "7px 8px" }}>{r.tempo || "—"}</td>
                      <td className="mono" style={{ padding: "7px 8px" }}>{fmtPace(r.pace)}</td>
                      <td className="mono" style={{ padding: "7px 8px" }}>{r.classCategoria ?? "—"}</td>
                      <td className="mono" style={{ padding: "7px 8px" }}>{r.classGeral ?? "—"}</td>
                      <td className="mono" style={{ padding: "7px 8px", textAlign: "right", fontWeight: 700 }}>{r.pontos}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      )}

      <footer style={{ textAlign: "center", padding: "24px 24px 30px", fontSize: 11, color: C.textFaint }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.textDim, letterSpacing: "0.04em", marginBottom: 4 }}>GRUPO DE CORRIDA PATRIOTAS · BOA VISTA DO BURICÁ, RS</div>
        Dados de origem: planilha CONTROLE_DESEMPENHO_PATRIOTAS.xlsx.<br/>
        Seus dados importados ficam salvos neste navegador (armazenamento local do arquivo).
      </footer>

      <div className="gear-btn" onClick={() => setShowImportModal(true)} title="Área restrita">
        <IconLock size={15} color={C.textDim} />
      </div>

      {showImportModal && (
        <ImportModal
          records={records}
          onImported={handleImported}
          onClose={() => setShowImportModal(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PatriotasDashboard />);
</script>
</body>
</html>
