  a{color:inherit;}
  table{border-collapse:collapse;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }
  @media (max-width:760px){

  .gear-btn{
    position:fixed; right:16px; bottom:16px; width:34px; height:34px; border-radius:50%;
    background:var(--surface); border:1px solid var(--border); display:flex; align-items:center;
    justify-content:center; cursor:pointer; opacity:.4; transition:opacity .2s ease, transform .2s ease;
    z-index:40;
  }
  .gear-btn:hover{ opacity:1; transform:scale(1.06); }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px;
  }
  .modal-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px;
    width:100%; max-width:420px; box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .badge-status {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;

  }

const STORAGE_KEY = "patriotas-dados-v1";
const UNLOCK_KEY = "patriotas-unlocked-v1";

function loadStored() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function saveStored(recs) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recs));
  } catch (e) {}
}
function loadUnlocked() {
  try { return localStorage.getItem(UNLOCK_KEY) === "1"; } catch (e) { return false; }
}
function saveUnlocked(v) {
  try { v ? localStorage.setItem(UNLOCK_KEY, "1") : localStorage.removeItem(UNLOCK_KEY); } catch (e) {}
}

/* Utilitários */
function normName(s) { return (s || "").toString().replace(/\s+/g, " ").trim(); }
function distGenero(categoria) {
  if (!categoria) return { grupo: "—", genero: "—", km: null };
  const c = categoria.trim();
  const letter = c[0];
  if (letter >= "A" && letter <= "J") return { grupo: "5KM · FEMININO", genero: "F", km: 5 };
  if (letter >= "K" && letter <= "U") return { grupo: "5KM · MASCULINO", genero: "M", km: 5 };
  if (letter >= "a" && letter <= "e") return { grupo: "2KM · MASCULINO", genero: "M", km: 2 };
  if (letter >= "f" && letter <= "j") return { grupo: "2KM · FEMININO", genero: "F", km: 2 };
  return { grupo: "OUTRA", genero: "—", km: null };
}
function faixaEtaria(categoria) {
  if (!categoria) return "";
  const m = categoria.match(/(\d{4}.*)$/);
  return m ? m[1].replace(/^[-–\s]+/, "") : categoria;
}
function fmtPace(pace) {
  if (!pace) return "—";
  const parts = String(pace).split(":");
  if (parts.length < 2) return pace;
  return `${parseInt(parts[0], 10)}:${parts[1]} /km`;
}
function fmtDateBR(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function excelDateToISO(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date && !isNaN(v)) {
    const y = v.getUTCFullYear(), m = String(v.getUTCMonth() + 1).padStart(2, "0"), d = String(v.getUTCDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  if (typeof v === "number") {
    const d = XLSX.SSF.parse_date_code(v);
    if (d) return `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}`;
  }
  const s = String(v).trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) {
    let day = parseInt(m[1], 10), month = parseInt(m[2], 10);
    let year = parseInt(m[3], 10);
    if (year < 100) year += 2000;
    if (month > 12 && day <= 12) { const t = day; day = month; month = t; }
    return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  }
  return null;
}
function excelTimeToStr(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date && !isNaN(v)) {
    const h = String(v.getUTCHours()).padStart(2, "0"), m = String(v.getUTCMinutes()).padStart(2, "0"), s = String(v.getUTCSeconds()).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }
  if (typeof v === "number") {
    const totalSec = Math.round(v * 86400);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
    const s = String(totalSec % 60).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }
  return String(v);
}

function parseWorkbookToRecords(workbook) {
  const sheetName = workbook.SheetNames.includes("DADOS") ? "DADOS" : workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });
  const records = [];
  let startIdx = 0;
  for (let i = 0; i < rows.length; i++) {
    if (rows[i] && rows[i].some((c) => (c || "").toString().toUpperCase().includes("NOME"))) {
      startIdx = i + 1; break;
    }
  }
  for (let i = startIdx; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r[2]) continue;
    records.push({
      data: excelDateToISO(r[0]), numero: r[1] || null, nome: normName(r[2]), categoria: normName(r[3]),
      local: r[4] || null, distancia: r[5] || null, tempo: excelTimeToStr(r[6]), pace: excelTimeToStr(r[7]),
      obs: r[8] || null, classCategoria: r[9] || null, classGeral: r[10] || null, pontos: Number(r[11]) || 0,
    });
  }
  return records;
}

function HBarChart({ data, height = 260 }) {
  const max = Math.max(1, ...data.map((d) => d.pontos));
  const rowH = data.length ? height / data.length : height;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6, height }}>
      {data.map((d, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, flex: 1 }}>
          <div style={{ width: 108, fontSize: 11, color: C.textDim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={d.nome}>{i + 1}. {d.nome}</div>
          <div style={{ flex: 1, background: C.surface2, borderRadius: 4, overflow: "hidden" }}>
            <div style={{
              width: `${(d.pontos / max) * 100}%`, minWidth: d.pontos ? 6 : 0, height: Math.max(14, rowH - 8),
              background: i < 3 ? C.orange : "#38404C", borderRadius: 4,
              display: "flex", alignItems: "center", justifyContent: "flex-end", paddingRight: 8,
            }}>
              <span className="mono" style={{ fontSize: 11, fontWeight: 700, color: i < 3 ? "#2A1400" : C.text }}>{d.pontos}</span>

      ))}

}

function LineChartSVG({ data, height = 180 }) {
  const [hover, setHover] = useState(null);
  const w = 600, h = height, padL = 30, padB = 22, padT = 14, padR = 12;
  const max = Math.max(1, ...data.map((d) => d.pontos));
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
  const pts = data.map((d, i) => ({
    x: padL + stepX * i,
    y: padT + innerH - (d.pontos / max) * innerH,
    ...d,
  }));
  const path = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x},${p.y}`).join(" ");
  return (
    <div style={{ position: "relative" }}>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height }} preserveAspectRatio="none">
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={padL} x2={w - padR} y1={padT + innerH * f} y2={padT + innerH * f} stroke={C.border} strokeWidth="1" />
        ))}
        <path d={path} fill="none" stroke={C.orange} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
        {pts.map((p, i) => (
          <circle key={i} cx={p.x} cy={p.y} r={hover === i ? 6 : 4} fill={C.orange}
            onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
            style={{ cursor: "pointer" }} />
        ))}
        {pts.map((p, i) => (
          <text key={i} x={p.x} y={h - 4} fontSize="10" fill={C.textFaint} textAnchor="middle">{p.etapa}</text>
        ))}
      </svg>
      {hover !== null && pts[hover] && (
        <div style={{
          position: "absolute", left: `${(pts[hover].x / w) * 100}%`, top: 0, transform: "translateX(-50%)",
          background: C.ink, color: C.text, fontSize: 11, padding: "4px 8px", borderRadius: 6, whiteSpace: "nowrap", pointerEvents: "none",
          border: `1px solid ${C.border}`,
        }}>
          {pts[hover].local}: <b>{pts[hover].pontos} pts</b>
        </div>
      )}
    </div>
  );
}

function ImportModal({ onClose, onImported, isFirebaseConnected }) {
  const [unlocked, setUnlocked] = useState(loadUnlocked());
  const [keyInput, setKeyInput] = useState("");
  const [keyError, setKeyError] = useState(false);
  const [importState, setImportState] = useState({ status: "idle", msg: "" });
  const fileInputRef = useRef(null);

  const tryUnlock = () => {
    if (keyInput === ACCESS_KEY) {
      setUnlocked(true);
      saveUnlocked(true);
      setKeyError(false);
    } else {
      setKeyError(true);
    }
  };

  const relock = () => {
    setUnlocked(false);
    saveUnlocked(false);
    setKeyInput("");
  };

  const handleFile = async (file) => {
    if (!file) return;
    setImportState({ status: "loading", msg: "Lendo e salvando dados..." });
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true, raw: true });
      const recs = parseWorkbookToRecords(wb);
      if (!recs.length) throw new Error("Nenhum resultado encontrado na aba DADOS.");
      
      await onImported(recs);
      setImportState({ 
        status: "success", 
        msg: `${recs.length} resultados importados ${isFirebaseConnected ? "e salvos no Firebase!" : "localmente."}` 
      });
    } catch (e) {
      setImportState({ status: "error", msg: e.message || "Falha ao importar o arquivo." });
    }
  };

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            {unlocked ? <IconUnlock size={16} color={C.success} /> : <IconLock size={16} color={C.orange} />}

          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: C.textDim, cursor: "pointer", padding: 4 }}>
            <IconX size={16} />
          </button>
        </div>

        <div style={{ marginBottom: 14 }}>
          {isFirebaseConnected ? (
            <span className="badge-status" style={{ background: "rgba(61,220,132,0.15)", color: C.success }}>
              <IconCloud size={13} /> Firebase Firestore Conectado
            </span>
          ) : (
            <span className="badge-status" style={{ background: "rgba(255,163,38,0.15)", color: C.orange }}>
              <IconAlert size={13} /> Modo Local (Cole as chaves no arquivo)
            </span>
          )}
        </div>

        {!unlocked && (
          <React.Fragment>
            <p style={{ fontSize: 12.5, color: C.textDim, margin: "0 0 14px" }}>
              Esta área é restrita. Digite a chave de acesso para enviar novos resultados.
            </p>
            <input
              type="password"
              value={keyInput}
              onChange={(e) => { setKeyInput(e.target.value); setKeyError(false); }}
              onKeyDown={(e) => e.key === "Enter" && tryUnlock()}
              placeholder="Chave de acesso"
              autoFocus
              style={{
                width: "100%", background: C.surface2, border: `1px solid ${keyError ? C.brick : C.border}`,
                borderRadius: 8, padding: "10px 12px", color: C.text, fontSize: 14, marginBottom: 8,
              }}
            />
            {keyError && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, color: C.brick, fontSize: 12, marginBottom: 10 }}>
                <IconAlert size={13} /> Chave incorreta.
              </div>
            )}
            <button
              onClick={tryUnlock}
              style={{
                width: "100%", background: C.orange, color: "#1A1200", border: "none", borderRadius: 8,
                padding: "10px 14px", fontWeight: 700, fontSize: 13, cursor: "pointer", marginTop: keyError ? 0 : 6,
              }}
            >
              Entrar
            </button>
          </React.Fragment>
        )}

        {unlocked && (
          <React.Fragment>
            <p style={{ fontSize: 12.5, color: C.textDim, margin: "0 0 14px" }}>
              Envie a planilha .xlsx (aba <b style={{ color: C.text }}>DADOS</b>). {isFirebaseConnected ? "Os dados serão sincronizados na nuvem em tempo real." : "Os dados ficarão salvos neste navegador."}
            </p>
            <input
              ref={fileInputRef}
              type="file"
              accept=".xlsx,.xlsm"
              style={{ display: "none" }}
              onChange={(e) => handleFile(e.target.files && e.target.files[0])}
            />
            <button
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              style={{
                display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%",
                background: C.orange, color: "#1A1200", border: "none", borderRadius: 8, padding: "10px 14px",
                fontWeight: 700, fontSize: 13, cursor: "pointer",
              }}
            >
              <IconUpload size={15} /> Importar planilha (.xlsx)
            </button>
            {importState.status !== "idle" && (
              <div style={{
                marginTop: 12, fontSize: 12, display: "flex", alignItems: "center", gap: 6,

              }}>

                {importState.msg}
              </div>
            )}

              onClick={relock}
              style={{

              }}
            >
              Bloquear novamente
            </button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function PatriotasDashboard() {

  const [selectedAtleta, setSelectedAtleta] = useState(null);
  const [showImportModal, setShowImportModal] = useState(false);
  const [isSyncing, setIsSyncing] = useState(false);

  // Sincronização em tempo real com Firebase Firestore
  useEffect(() => {
    if (!db) return;
    setIsSyncing(true);
    const unsubscribe = db.collection("patriotas").doc("dados_gerais")
      .onSnapshot((doc) => {
        setIsSyncing(false);
        if (doc.exists) {
          const cloudData = doc.data();
          if (cloudData && Array.isArray(cloudData.records) && cloudData.records.length > 0) {
            setRecords(cloudData.records);
            saveStored(cloudData.records);
          }
        } else {
          // Se o documento ainda não existir no Firestore, salva os dados iniciais
          db.collection("patriotas").doc("dados_gerais").set({
            records: RAW_SEED,
            updatedAt: new Date().toISOString()
          }).catch(console.error);
        }
      }, (error) => {
        setIsSyncing(false);
        console.warn("Aviso ao sincronizar Firestore:", error.message);
      });

    return () => unsubscribe();
  }, []);

  const handleImported = useCallback(async (recs) => {
    setRecords(recs);
    saveStored(recs);
    setSelectedAtleta(null);

    // Salva no Firestore
    if (db) {
      await db.collection("patriotas").doc("dados_gerais").set({
        records: recs,
        updatedAt: new Date().toISOString()
      });
    }
  }, []);

  const etapas = useMemo(() => {
    const map = new Map();
    records.forEach((r) => {
      if (!r.data) return;
      const key = `${r.data}__${r.local}`;
      if (!map.has(key)) map.set(key, { data: r.data, local: r.local });
    });
    return Array.from(map.values()).sort((a, b) => (a.data > b.data ? 1 : -1));
  }, [records]);

  const scoped = useMemo(() => {
    let recs = records;
    if (distFilter !== "TODAS") recs = recs.filter((r) => distGenero(r.categoria).grupo === distFilter);
    if (selectedEtapaIdx >= 0 && etapas[selectedEtapaIdx]) {
      const et = etapas[selectedEtapaIdx];
      recs = recs.filter((r) => r.data === et.data && r.local === et.local);
    }
    return recs;
  }, [records, distFilter, selectedEtapaIdx, etapas]);

  const ranking = useMemo(() => {
    const agg = new Map();
    scoped.forEach((r) => {
      if (!r.nome) return;
      if (!agg.has(r.nome)) agg.set(r.nome, { nome: r.nome, categoria: r.categoria, pontos: 0, etapas: 0, melhorClass: null, resultados: [] });

      }
      a.resultados.push(r);

              { icon: IconFlag, label: "Etapas disputadas", value: kpis.totalEtapas },
              { icon: IconTrophy, label: "Pontos distribuídos", value: kpis.totalPontos },
              { icon: IconMapPin, label: "Última etapa", value: kpis.ultimaEtapa ? kpis.ultimaEtapa.local : "—", small: true },
            ].map((k, i) => (
              <div key={i} style={{ background: "#0D1014", padding: "16px 18px" }}>
                <k.icon size={15} color={C.orange} />
                <div className={k.small ? "" : "mono"} style={{ fontSize: k.small ? 18 : 28, fontWeight: 700, marginTop: 8, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                  {k.value}
                </div>
                <div style={{ fontSize: 11, color: C.textFaint, marginTop: 2, letterSpacing: "0.04em" }}>{k.label.toUpperCase()}</div>
              </div>
            ))}
          </div>
        </div>
      </header>

      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "26px 24px 0" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
          <IconTimer size={15} color={C.orangeDeep} />
          <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.1em", color: C.textDim }}>PERCURSO DO CIRCUITO</span>
        </div>
        <div className="checkpoint-track" style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8 }}>
          <button onClick={() => setSelectedEtapaIdx(-1)}
            style={{ position: "relative", zIndex: 1, flex: "0 0 auto", cursor: "pointer", border: "none",
              background: selectedEtapaIdx === -1 ? C.orange : C.surface, color: selectedEtapaIdx === -1 ? "#2A1400" : C.text,
              borderRadius: 999, padding: "10px 16px", fontSize: 12, fontWeight: 700, whiteSpace: "nowrap" }}>
            GERAL · TODAS
          </button>
          {etapas.map((et, idx) => (
            <button key={idx} onClick={() => setSelectedEtapaIdx(idx)}
              style={{ position: "relative", zIndex: 1, flex: "0 0 auto", cursor: "pointer", textAlign: "left",
                border: `2px solid ${selectedEtapaIdx === idx ? C.orange : C.border}`,
                background: selectedEtapaIdx === idx ? C.orange : C.surface, color: selectedEtapaIdx === idx ? "#2A1400" : C.text,
                borderRadius: 10, padding: "8px 14px", minWidth: 130 }}>
              <div className="mono" style={{ fontSize: 10, fontWeight: 700, opacity: 0.75, display: "flex", alignItems: "center", gap: 5 }}>
                <span className="hexagon" style={{ width: 8, height: 8, background: selectedEtapaIdx === idx ? "#2A1400" : C.blue, display: "inline-block" }} />
                ETAPA {idx + 1} · {fmtDateBR(et.data)}
              </div>
              <div style={{ fontSize: 13, fontWeight: 700 }}>{et.local}</div>
            </button>
          ))}
        </div>
      </div>

      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "22px 24px 0", display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" }}>
        <div style={{ position: "relative" }}>
          <select value={distFilter} onChange={(e) => setDistFilter(e.target.value)}
            style={{ appearance: "none", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8,
              padding: "9px 34px 9px 14px", fontSize: 13, fontWeight: 600, color: C.text, cursor: "pointer" }}>
            {distOptions.map((d) => <option key={d} value={d}>{d === "TODAS" ? "Todas as provas / categorias" : d}</option>)}
          </select>
          <IconChevronDown size={14} color={C.textDim} style={{ position: "absolute", right: 12, top: 11, pointerEvents: "none" }} />
        </div>
        {selectedAtleta && (
          <button onClick={() => setSelectedAtleta(null)}
            style={{ display: "flex", alignItems: "center", gap: 6, background: C.surface2, color: C.text, border: `1px solid ${C.border}`,
              borderRadius: 8, padding: "9px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
            <IconX size={13} /> {selectedAtleta.split(" ").slice(0, 2).join(" ")}
          </button>
        )}
      </div>

      <div className="grid-2" style={{ maxWidth: 1180, margin: "0 auto", padding: "26px 24px", display: "grid", gridTemplateColumns: "1.15fr 1fr", gap: 20 }}>
        <section style={{ background: C.surface, borderRadius: 14, padding: 22, border: `1px solid ${C.border}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
            <IconTrophy size={16} color={C.orangeDeep} />
            <h2 className="disp" style={{ fontSize: 24, margin: 0, letterSpacing: "0.03em" }}>
              RANKING {selectedEtapaIdx === -1 ? "GERAL" : `· ETAPA ${selectedEtapaIdx + 1}`}
            </h2>
          </div>

          {ranking.length > 0 && (
            <div style={{ display: "flex", alignItems: "flex-end", gap: 10, marginBottom: 20 }}>
              {[1, 0, 2].map((pos) => {
                const a = ranking[pos];
                if (!a) return <div key={pos} style={{ flex: 1 }} />;
                const heights = { 0: 92, 1: 68, 2: 52 };
                return (
                  <div key={pos} style={{ flex: 1, textAlign: "center", cursor: "pointer" }} onClick={() => setSelectedAtleta(a.nome)}>
                    <div style={{ fontSize: 11, fontWeight: 700, marginBottom: 4, color: C.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                      {a.nome.split(" ").slice(0, 2).join(" ")}
                    </div>
                    <div className="mono" style={{ fontSize: 11, color: C.textFaint, marginBottom: 6 }}>{a.pontos} pts</div>
                    <div style={{ height: heights[pos], background: pos === 0 ? `linear-gradient(160deg, ${C.blue}, ${C.blueDeep})` : MEDAL_COLORS[pos], borderRadius: "6px 6px 0 0",
                      display: "flex", alignItems: "flex-start", justifyContent: "center", paddingTop: 10, position: "relative" }}>
                      <div className="hexagon" style={{ width: 30, height: 30, background: pos === 0 ? C.orange : C.ink, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <span className="disp" style={{ fontSize: 16, color: pos === 0 ? "#2A1400" : "#fff" }}>{pos + 1}</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <div style={{ maxHeight: 340, overflowY: "auto" }}>
            <table style={{ width: "100%", fontSize: 13 }}>
              <thead>
                <tr style={{ textAlign: "left", color: C.textFaint, fontSize: 11, letterSpacing: "0.06em" }}>
                  <th style={{ padding: "6px 6px" }}>#</th>
                  <th style={{ padding: "6px 6px" }}>ATLETA</th>
                  <th style={{ padding: "6px 6px" }}>CATEGORIA</th>
                  <th style={{ padding: "6px 6px", textAlign: "right" }}>ETAPAS</th>
                  <th style={{ padding: "6px 6px", textAlign: "right" }}>PONTOS</th>
                </tr>
              </thead>
              <tbody>
                {ranking.map((a, i) => (
                  <tr key={a.nome} onClick={() => setSelectedAtleta(a.nome)}
                    style={{ borderTop: `1px solid ${C.border}`, cursor: "pointer", background: selectedAtleta === a.nome ? "rgba(255,163,38,0.10)" : "transparent" }}>
                    <td className="mono" style={{ padding: "8px 6px", color: i < 3 ? C.orangeDeep : C.textDim, fontWeight: i < 3 ? 700 : 400 }}>{i + 1}</td>
                    <td style={{ padding: "8px 6px", fontWeight: 600 }}>{a.nome}</td>
                    <td style={{ padding: "8px 6px", color: C.textFaint, fontSize: 11 }}>{faixaEtaria(a.categoria)}</td>
                    <td className="mono" style={{ padding: "8px 6px", textAlign: "right" }}>{a.etapas}</td>
                    <td className="mono" style={{ padding: "8px 6px", textAlign: "right", fontWeight: 700 }}>{a.pontos}</td>
                  </tr>
                ))}
                {ranking.length === 0 && <tr><td colSpan={5} style={{ padding: 20, textAlign: "center", color: C.textFaint }}>Sem resultados para este filtro.</td></tr>}
              </tbody>
            </table>
          </div>
        </section>

        <section style={{ background: "#0D1014", borderRadius: 14, padding: 22, border: `1px solid ${C.border}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
            <IconTrend size={16} color={C.orange} />
            <h2 className="disp" style={{ fontSize: 22, margin: 0 }}>PONTUAÇÃO DA CATEGORIA</h2>
          </div>
          <p style={{ fontSize: 11, color: C.textDim, marginBottom: 10 }}>
            {top8Chart.length} atleta{top8Chart.length === 1 ? "" : "s"} · clique num nome do ranking ao lado para ver a evolução do atleta.
          </p>
          <div style={{ maxHeight: 340, overflowY: "auto", paddingRight: 4 }}>
            <HBarChart data={top8Chart} height={Math.max(160, top8Chart.length * 30)} />
          </div>
        </section>
      </div>

      {athleteDetail && (
        <div style={{ maxWidth: 1180, margin: "0 auto", padding: "0 24px 26px" }}>
          <section style={{ background: C.surface, borderRadius: 14, padding: 22, border: `1px solid ${C.border}` }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 14, marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 11, color: C.orangeDeep, fontWeight: 700, letterSpacing: "0.08em" }}>FICHA DO ATLETA</div>
                <h2 className="disp" style={{ fontSize: 30, margin: "2px 0" }}>{athleteDetail.nome}</h2>
                <span style={{ fontSize: 12, color: C.textFaint }}>{faixaEtaria(athleteDetail.categoria)} · {distGenero(athleteDetail.categoria).grupo}</span>
              </div>
              <div style={{ display: "flex", gap: 18 }}>
                <div style={{ textAlign: "center" }}><div className="mono" style={{ fontSize: 26, fontWeight: 700 }}>{athleteDetail.pontos}</div><div style={{ fontSize: 10, color: C.textFaint }}>PONTOS</div></div>
                <div style={{ textAlign: "center" }}><div className="mono" style={{ fontSize: 26, fontWeight: 700 }}>{athleteDetail.etapas}</div><div style={{ fontSize: 10, color: C.textFaint }}>ETAPAS</div></div>
                <div style={{ textAlign: "center" }}><div className="mono" style={{ fontSize: 26, fontWeight: 700 }}>{athleteDetail.melhorClass ?? "—"}</div><div style={{ fontSize: 10, color: C.textFaint }}>MELHOR POSIÇÃO</div></div>
              </div>
            </div>

            <LineChartSVG data={pontosPorEtapaChart} height={180} />

            <div style={{ overflowX: "auto", marginTop: 16 }}>
              <table style={{ width: "100%", fontSize: 12.5, minWidth: 640 }}>
                <thead>
                  <tr style={{ textAlign: "left", color: C.textFaint, fontSize: 11 }}>
                    <th style={{ padding: "6px 8px" }}>ETAPA</th><th style={{ padding: "6px 8px" }}>DATA</th>
                    <th style={{ padding: "6px 8px" }}>TEMPO</th><th style={{ padding: "6px 8px" }}>PACE</th>
                    <th style={{ padding: "6px 8px" }}>POS. CATEGORIA</th><th style={{ padding: "6px 8px" }}>POS. GERAL</th>
                    <th style={{ padding: "6px 8px", textAlign: "right" }}>PONTOS</th>
                  </tr>
                </thead>
                <tbody>
                  {athleteDetail.resultados.slice().sort((a, b) => (a.data > b.data ? 1 : -1)).map((r, i) => (
                    <tr key={i} style={{ borderTop: `1px solid ${C.border}` }}>
                      <td style={{ padding: "7px 8px", fontWeight: 600 }}>{r.local}</td>
                      <td className="mono" style={{ padding: "7px 8px" }}>{fmtDateBR(r.data)}</td>
                      <td className="mono" style={{ padding: "7px 8px" }}>{r.tempo || "—"}</td>
                      <td className="mono" style={{ padding: "7px 8px" }}>{fmtPace(r.pace)}</td>
                      <td className="mono" style={{ padding: "7px 8px" }}>{r.classCategoria ?? "—"}</td>
                      <td className="mono" style={{ padding: "7px 8px" }}>{r.classGeral ?? "—"}</td>
                      <td className="mono" style={{ padding: "7px 8px", textAlign: "right", fontWeight: 700 }}>{r.pontos}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      )}

      <footer style={{ textAlign: "center", padding: "24px 24px 30px", fontSize: 11, color: C.textFaint }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.textDim, letterSpacing: "0.04em", marginBottom: 4 }}>GRUPO DE CORRIDA PATRIOTAS · BOA VISTA DO BURICÁ, RS</div>
        Dados sincronizados via Google Firebase Cloud Firestore.<br/>
        Os dados atualizados pelo administrador ficam visíveis para todos os atletas em tempo real.
      </footer>

      <div className="gear-btn" onClick={() => setShowImportModal(true)} title="Área restrita / Importar">
        <IconLock size={15} color={C.textDim} />
      </div>

      {showImportModal && (
        <ImportModal
          onImported={handleImported}
          onClose={() => setShowImportModal(false)}
          isFirebaseConnected={isFirebaseConfigured}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PatriotasDashboard />);
</script>
</body>
</html>
